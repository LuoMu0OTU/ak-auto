[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-auto"
version = "0.1.0"
description = "明日方舟本地自动化助手（由 MaaFramework 驱动）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "local" }]
dependencies = [
    "maafw==5.14.3",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ak-auto = "ak_auto.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
